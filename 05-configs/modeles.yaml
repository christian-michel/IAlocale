# modeles.yaml — profils de modèles nommés, pour basculer facilement
# entre plusieurs LLM locaux sans retaper un id à chaque fois.
#
# Ce fichier ne se charge pas tout seul : 04-scripts/basculer-modele.sh lit
# le profil demandé ici, puis réutilise setup-local-model.sh (déjà testé,
# voir README) pour appliquer le changement dans ~/.dsh/settings.yaml.
#
# Chaque profil correspond à un usage documenté dans README.md, section
# "Optimisation pour Mac Mini M4" : un modèle "instruct" rapide pour
# l'exécution d'agent courante (outils, code), un modèle "thinking" plus
# lent réservé aux tâches qui demandent un vrai raisonnement explicite
# (skill-analyse-objectifs, décisions à fort enjeu). Un seul profil est
# chargé à la fois — 24 Go ne permet pas de faire tourner les deux en
# simultané, c'est tout l'intérêt de pouvoir basculer.
#
# ❌ Kimi-K2.6 et GLM-5.2 (demandés initialement) sont exclus ici en
# connaissance de cause, pas par oubli : ce sont des MoE à ~1000 Md et
# ~744 Md de paramètres totaux. Même à la quantification la plus agressive
# publiée (IQ3_XXS / 2-bit dynamique), ils demandent ~394 Go et ~241 Go de
# mémoire — 15 à 25 fois les 24 Go disponibles. Ollama ne les propose
# d'ailleurs qu'en tags ":cloud" (requête renvoyée vers l'infrastructure
# Moonshot/Z.ai), ce qui violerait la contrainte "aucune API cloud pour le
# fonctionnement quotidien" de CLAUDE.md. Si une version distillée/allégée
# officielle apparaît un jour pour l'un des deux, réévalue à ce moment-là.
#
# ✅ Les deux id ci-dessous sont vérifiés comme existants sur
# ollama.com/library (recherche du 2026-09-13), même famille Qwen3-30B-A3B
# (MoE, seulement 3 Md de paramètres actifs par passe → vitesse d'un petit
# modèle, connaissances d'un 30B) — mais leur comportement RÉEL sur cette
# machine n'a pas pu être testé ici (pas d'Ollama dans cet environnement).
# Après `ollama pull`, confirme l'id exact servi avec :
#   curl -s http://127.0.0.1:11434/v1/models | jq -r '.data[].id'
# (piège déjà documenté dans setup-local-model.sh : un id qui ne
# correspond pas caractère pour caractère, y compris les ":", échoue en
# 404 silencieux côté dsh.)

profils:
  rapide:
    modele: qwen3-coder:30b-a3b-q4_K_M
    description: "MoE 30B/3B actifs, quantifié Q4 (~19 Go). Exécution d'agent courante (outils, code). Défaut recommandé au quotidien."
  reflexion:
    modele: qwen3:30b-a3b-thinking-2507-q4_K_M
    description: "Même famille, variante thinking (~19 Go). Analyse d'objectifs, décisions complexes, où le temps de raisonnement est justifié."

profil-par-defaut: rapide
